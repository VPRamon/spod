# spod — single-crate Precise Orbit Determination toolkit.
#
# The previous multi-crate workspace has been collapsed: every former
# sub-crate is now a module inside this single library.  The
# [workspace] block is kept only to let target-sgp4-test/probe
# inherit its edition/version metadata.

[package]
name         = "spod"
version      = "0.1.0"
edition      = "2021"
rust-version = "1.89"
authors      = ["Siderust authors"]
license      = "AGPL-3.0-or-later"
repository   = "https://github.com/VPRamon/spod"
homepage     = "https://github.com/VPRamon/spod"
keywords     = ["satellite", "pod", "orbit-determination", "geodesy", "gnss"]
categories   = ["science", "aerospace"]
publish      = false
description  = "Precise Orbit Determination toolkit (POD) service built on Siderust."

[[example]]
name = "03_lambert_earth_to_mars"
path = "examples/03_lambert_earth_to_mars.rs"

[[example]]
name = "04_sgp4_from_tle"
path = "examples/04_sgp4_from_tle.rs"

[features]
default = ["serde"]
## Compatibility feature; serialization support is always available.
serde   = []
## DORIS RINEX observation support from Siderust.
doris   = ["siderust/pod-doris"]
## LISA inter-satellite range observation model.
lisa    = []
## Integration tests that load a JPL DE kernel from disk (de440/de441).
de440   = []
## Parquet residuals support, shared with Siderust's POD feature.
parquet = ["siderust/pod-parquet"]

[dependencies]
# ── Baseline crates ───────────────────────────────────────────────────────────
cheby     = "0.4.2"
siderust  = { version = "0.12", features = ["pod"] }

# ── SGP4 propagation backend ──────────────────────────────────────────────────
sgp4 = { version = "2.4", default-features = false, features = ["std"] }

# ── Linear algebra ────────────────────────────────────────────────────────────
# ── Serialisation ─────────────────────────────────────────────────────────────
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# serde_yaml is always required (used unconditionally in the service module).
serde_yaml = "0.9"

# ── Error handling ────────────────────────────────────────────────────────────
thiserror = "1.0"
anyhow    = "1.0"

# ── Time ──────────────────────────────────────────────────────────────────────
chrono = "0.4"

# ── XML parsing ────────────────────────────────────────────────────────────────
quick-xml = "0.41"

# ── HTTP / REST ────────────────────────────────────────────────────────────────
axum  = "0.7"
tokio = { version = "1.39", features = ["macros", "rt-multi-thread"] }
tower = "0.5"
uuid  = { version = "1.10", features = ["v4"] }

# ── CLI ────────────────────────────────────────────────────────────────────────
clap = { version = "4.5", features = ["derive"] }

# ── Logging ────────────────────────────────────────────────────────────────────
log        = "0.4"
env_logger = "0.11"

[dev-dependencies]
approx   = "0.5"
trybuild = "1.0"
serde    = { version = "1.0", features = ["derive"] }
toml     = "0.8"

# ── Workspace (minimal — only for the sgp4-probe fixture) ─────────────────────
[workspace]
resolver = "2"
members  = ["target-sgp4-test/probe"]

[workspace.package]
version      = "0.1.0"
edition      = "2021"
rust-version = "1.89"
authors      = ["Siderust authors"]
license      = "AGPL-3.0-or-later"
repository   = "https://github.com/VPRamon/spod"
homepage     = "https://github.com/VPRamon/spod"
keywords     = ["satellite", "pod", "orbit-determination", "geodesy", "gnss"]
categories   = ["science", "aerospace"]

[workspace.lints.rust]
unsafe_code     = "forbid"
missing_docs    = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
all           = { level = "deny", priority = -1 }
todo          = "deny"
unimplemented = "deny"
dbg_macro     = "deny"
print_stdout  = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
panic         = "abort"

[profile.bench]
opt-level = 3
lto       = "thin"

[lints]
workspace = true
