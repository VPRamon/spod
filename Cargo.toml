# spod — service application for Siderust POD workflows.
#
# Reusable POD science is provided by Siderust; this package owns service
# orchestration, interfaces, format adapters, and application-specific
# functionality.

[package]
name         = "spod"
version      = "0.1.0"
edition      = "2021"
rust-version = "1.89"
authors      = ["Siderust authors"]
license      = "AGPL-3.0-or-later"
repository   = "https://github.com/VPRamon/spod"
homepage     = "https://github.com/VPRamon/spod"
keywords     = ["satellite", "pod", "orbit-determination", "geodesy", "gnss"]
categories   = ["science", "aerospace"]
publish      = false
description  = "Precise Orbit Determination service application built on Siderust."

[features]
default = ["serde"]
## Compatibility feature; serialization support is always available.
serde   = []

[dependencies]
siderust  = { version = "0.12", features = ["pod"] }

# ── Linear algebra ────────────────────────────────────────────────────────────
# ── Serialisation ─────────────────────────────────────────────────────────────
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# serde_yaml is always required (used unconditionally in the service module).
serde_yaml = "0.9"

# ── Error handling ────────────────────────────────────────────────────────────
thiserror = "1.0"
anyhow    = "1.0"

# ── Time ──────────────────────────────────────────────────────────────────────
chrono = "0.4"

# ── HTTP / REST ────────────────────────────────────────────────────────────────
axum  = "0.7"
tokio = { version = "1.39", features = ["macros", "rt-multi-thread"] }
tower = "0.5"
uuid  = { version = "1.10", features = ["v4"] }

# ── CLI ────────────────────────────────────────────────────────────────────────
clap = { version = "4.5", features = ["derive"] }

# ── Logging ────────────────────────────────────────────────────────────────────
log        = "0.4"
env_logger = "0.11"

[dev-dependencies]
serde    = { version = "1.0", features = ["derive"] }

[workspace]
resolver = "2"

[workspace.package]
version      = "0.1.0"
edition      = "2021"
rust-version = "1.89"
authors      = ["Siderust authors"]
license      = "AGPL-3.0-or-later"
repository   = "https://github.com/VPRamon/spod"
homepage     = "https://github.com/VPRamon/spod"
keywords     = ["satellite", "pod", "orbit-determination", "geodesy", "gnss"]
categories   = ["science", "aerospace"]

[workspace.lints.rust]
unsafe_code     = "forbid"
missing_docs    = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
all           = { level = "deny", priority = -1 }
todo          = "deny"
unimplemented = "deny"
dbg_macro     = "deny"
print_stdout  = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
panic         = "abort"

[profile.bench]
opt-level = 3
lto       = "thin"

[lints]
workspace = true
